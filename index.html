<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chart Analyzer V1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:25px;margin:0}.sub{color:#9ca8c7;margin:6px 0 18px}
.card{background:#121a2e;border:1px solid #273454;border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;color:#aeb9d6;font-size:13px;margin-bottom:6px}
input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #344363;background:#0d1426;color:#fff}
button{background:#2563eb;border:0;font-weight:bold;cursor:pointer}.upload{border:2px dashed #405174;text-align:center;padding:28px;border-radius:14px;cursor:pointer}
#preview{max-width:100%;max-height:480px;display:none;margin:15px auto;border-radius:10px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{padding:14px;border-radius:12px;background:#0d1426;border:1px solid #263453}
.buy{border-color:#166534}.sell{border-color:#7f1d1d}.muted{color:#9ca8c7}.big{font-size:22px;font-weight:bold;margin-top:5px}
.note{font-size:13px;color:#aeb9d6;line-height:1.7}
@media(max-width:700px){.grid,.results{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>📊 Chart Analyzer V1</h1><div class="sub">دعم • مقاومة • دخول • وقف • أهداف</div></div></div>

<div class="card">
<div class="grid">
<div class="field"><label>الرمز</label><input id="symbol" placeholder="XAUUSD"></div>
<div class="field"><label>الفريم</label><select id="tf"><option>M1</option><option selected>M5</option><option>M15</option><option>M30</option><option>H1</option><option>H4</option><option>D1</option></select></div>
<div class="field"><label>أعلى سعر ظاهر بالشارت</label><input id="high" type="number" step="any" placeholder="مثال 3950"></div>
<div class="field"><label>أدنى سعر ظاهر بالشارت</label><input id="low" type="number" step="any" placeholder="مثال 3900"></div>
</div>
</div>

<div class="card">
<label class="upload" for="file">📷 اضغط هنا وارفع صورة الشارت</label>
<input id="file" type="file" accept="image/*" hidden>
<img id="preview">
<div class="note">يفضل أن تكون الصورة واضحة ويظهر فيها محور الأسعار والشموع. إدخال أعلى وأدنى سعر يساعد V1 على تحويل مناطق الصورة إلى أسعار.</div>
</div>

<div class="card">
<button id="analyze">🔎 تحليل الشارت</button>
</div>

<div id="out" class="card" style="display:none">
<div class="results">
<div class="box"><span class="muted">الاتجاه</span><div id="trend" class="big">-</div></div>
<div class="box"><span class="muted">قوة الإشارة</span><div id="strength" class="big">-</div></div>
<div class="box"><span class="muted">القرار</span><div id="decision" class="big">-</div></div>
</div>
<div class="results" style="margin-top:10px">
<div class="box"><span class="muted">الدعم</span><div id="support" class="big">-</div></div>
<div class="box"><span class="muted">المقاومة</span><div id="resist" class="big">-</div></div>
<div class="box"><span class="muted">منطقة الدخول</span><div id="entry" class="big">-</div></div>
</div>
<div class="results" style="margin-top:10px">
<div class="box"><span class="muted">Stop Loss</span><div id="sl" class="big">-</div></div>
<div class="box"><span class="muted">TP1</span><div id="tp1" class="big">-</div></div>
<div class="box"><span class="muted">TP2</span><div id="tp2" class="big">-</div></div>
</div>
<p id="reason" class="note"></p>
</div>
</div>

<script>
const file=document.getElementById('file'), preview=document.getElementById('preview');
file.onchange=()=>{const f=file.files[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.style.display='block';};

function fmt(x){
 if(!isFinite(x)) return '-';
 const d=Math.abs(x)>=1000?2:Math.abs(x)>=100?2:Math.abs(x)>=10?3:5;
 return x.toFixed(d);
}
function analyze(){
 const hi=parseFloat(document.getElementById('high').value);
 const lo=parseFloat(document.getElementById('low').value);
 if(!(hi>lo)){alert('اكتب أعلى وأدنى سعر ظاهر بالشارت أولاً.');return;}
 const range=hi-lo;
 // V1 heuristic: creates robust test zones from the visible range.
 const support=lo+range*.30;
 const resistance=hi-range*.30;
 const buy=lo+range*.38;
 const sell=hi-range*.38;
 const slBuy=lo+range*.18, tp1Buy=lo+range*.62, tp2Buy=lo+range*.78;
 const slSell=hi-range*.18, tp1Sell=hi-range*.62, tp2Sell=hi-range*.78;

 document.getElementById('out').style.display='block';
 document.getElementById('support').textContent=fmt(support);
 document.getElementById('resist').textContent=fmt(resistance);

 // Direction is deliberately marked as provisional until live OHLC data is connected.
 const img=preview.naturalWidth>0;
 document.getElementById('trend').textContent='يحتاج بيانات الشموع';
 document.getElementById('strength').textContent='V1 تجريبية';
 document.getElementById('decision').textContent='انتظر';
 document.getElementById('entry').textContent=fmt(buy)+' / '+fmt(sell);
 document.getElementById('sl').textContent=fmt(slBuy)+' / '+fmt(slSell);
 document.getElementById('tp1').textContent=fmt(tp1Buy)+' / '+fmt(tp1Sell);
 document.getElementById('tp2').textContent=fmt(tp2Buy)+' / '+fmt(tp2Sell);
 document.getElementById('reason').textContent=
 'V1 الحالية تبني مناطق أولية من نطاق السعر الظاهر. هذه ليست إشارة تداول نهائية بعد. الخطوة التالية هي قراءة الشموع فعلياً وربط OHLC حتى يصبح الاتجاه والدخول والدعم والمقاومة ديناميكية.';
}
document.getElementById('analyze').onclick=analyze;
</script>
</body>
</html>
